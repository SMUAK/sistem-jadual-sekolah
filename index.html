<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Jadual Waktu & Relief Sekolah</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tree-line { border-left: 1px dotted #cbd5e1; margin-left: 1rem; padding-left: 0.75rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-[#0b1b3d] text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold">SMU(A) Khairiah Banggol Setol - Modul GMP Interaktif</h1>
        </div>
    </header>

    <!-- Kandungan Utama -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
        <section id="tab-guru_matapelajaran" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex items-center space-x-3 border-b pb-3 mb-4">
                    <div class="bg-[#0b1b3d] text-white p-2.5 rounded-xl text-xl font-bold">👨‍🏫</div>
                    <div>
                        <h2 class="text-lg font-bold text-[#0b1b3d]">Pengurusan Guru Mata Pelajaran (Matriks Agihan & Agihan Kelas)</h2>
                        <p class="text-xs text-slate-500">Warna hijau sorotan hanya muncul pada item yang diklik sahaja</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <!-- Pohon Senarai Guru (Kiri) -->
                    <div class="md:col-span-4 bg-slate-50 border border-slate-200 p-4 rounded-xl overflow-y-auto max-h-[600px] text-xs">
                        <h3 class="font-bold text-[#0b1b3d] mb-3 border-b pb-2">Senarai Guru & Beban Masa</h3>
                        <div id="gmp-teacher-tree" class="space-y-2 font-mono"></div>
                    </div>

                    <!-- Jadual Matriks Agihan (Kanan) -->
                    <div class="md:col-span-8 bg-white border border-slate-200 p-4 rounded-xl overflow-x-auto max-h-[600px] relative text-xs">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-[#0b1b3d]">Jadual Matriks Agihan Subjek / Kelas</h3>
                            <span class="text-[11px] text-slate-500">Klik item untuk sorotan aktif</span>
                        </div>
                        <table class="w-full border-collapse border border-slate-300 text-center text-xs">
                            <thead>
                                <tr id="gmp-matrix-thead" class="bg-slate-100 text-slate-800 font-bold">
                                    <th class="border border-slate-300 p-2 min-w-[120px] text-left">Kelas/Program</th>
                                </tr>
                            </thead>
                            <tbody id="gmp-matrix-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Skrip Aplikasi -->
    <script type="module">
        let databaseRecords = {
            subjek: [
                { id: 1, name: "Bahasa Melayu", code: "BM", category: "Teras" },
                { id: 2, name: "Matematik", code: "MAT", category: "Teras" }
            ],
            kelas: [
                { id: 1, name: "Tingkatan 1 - IS", code: "1IS", category: "Menengah Rendah" },
                { id: 2, name: "Tingkatan 2 - IS", code: "2IS", category: "Menengah Rendah" }
            ],
            senarai_guru: [
                { id: 1, name: "ASRI B MOHD ZAIN", code: "Asri", category: "Arab / Agama" },
                { id: 2, name: "AHMAD ROSLI", code: "Ahmad", category: "Akademik" }
            ],
            guru: [
                {
                    id: 1,
                    name: "ASRI B MOHD ZAIN",
                    code: "Asri",
                    category: "Tingkatan 1 - IS [Matematik (2 Masa)]"
                },
                {
                    id: 2,
                    name: "AHMAD ROSLI",
                    code: "Ahmad",
                    category: "Tingkatan 1 - IS [Bahasa Melayu (2 Masa)] | Tingkatan 2 - IS [Bahasa Melayu (3 Masa)]"
                }
            ]
        };

        let gmpAllocations = {
            "Tingkatan 1 - IS_BM": "Ahmad",
            "Tingkatan 2 - IS_BM": "Ahmad",
            "Tingkatan 1 - IS_MAT": "Asri"
        };

        let expandedTeachersMap = {
            "ASRI B MOHD ZAIN": true,
            "AHMAD ROSLI": true
        };

        // NULL SECARA DEFAULT: TIADA ITEM DIPILIH SEHINGGA DIKLIK OLEH PENGGUNA!
        let selectedActiveSubItem = null; 

        // RENDER JADUAL MATRIKS AGIHAN (DEFAULT PETAK PUTIH / WARNA HIJAU HANYA PADA ITEM AKTIF)
        function renderGMPMatrix() {
            const thead = document.getElementById('gmp-matrix-thead');
            const tbody = document.getElementById('gmp-matrix-tbody');
            if(!thead || !tbody) return;

            let subjekList = databaseRecords.subjek || [];
            let kelasList = databaseRecords.kelas || [];

            let headHTML = `<th class="border border-slate-300 p-2 text-left min-w-[120px]">Kelas/Program</th>`;
            subjekList.forEach(s => {
                headHTML += `<th class="border border-slate-300 p-2 min-w-[45px] text-center">${s.code}</th>`;
            });
            thead.innerHTML = headHTML;

            let bodyHTML = '';
            kelasList.forEach(cls => {
                bodyHTML += `<tr><td class="border border-slate-300 p-2 font-bold text-slate-700 text-left bg-slate-50">${cls.name}</td>`;
                subjekList.forEach(s => {
                    let key = `${cls.name}_${s.code}`;
                    let assignedTeacher = gmpAllocations[key] || '';
                    
                    // SEMAK ADAKAH PETAK INI SEDANG DIKLIK PENGGUNA
                    let isCellActive = selectedActiveSubItem && 
                                       selectedActiveSubItem.kelas.toLowerCase() === cls.name.toLowerCase() && 
                                       selectedActiveSubItem.subjekCode.toLowerCase() === s.code.toLowerCase();

                    // LOGIK WARNA TERKINI:
                    // Jika diklik (isCellActive): Warna hijau muda cerah berserta bingkai garis (bg-emerald-200)
                    // Jika TIDAK diklik: Kekal warna latar PUTIH bersih (bg-white hover:bg-slate-50)
                    let bgCellClass = isCellActive 
                        ? 'bg-emerald-200 text-emerald-950 font-extrabold border-2 border-dashed border-emerald-600 shadow-sm' 
                        : 'bg-white text-slate-800 hover:bg-slate-50';

                    bodyHTML += `
                        <td class="border border-slate-300 p-1.5 text-center relative cursor-pointer transition ${bgCellClass}"
                            onclick="onMatrixCellClick(event, '${cls.name}', '${s.code}', '${assignedTeacher}')">
                            <div class="flex items-center justify-center space-x-0.5 font-medium">
                                ${assignedTeacher ? `<span class="${isCellActive ? 'text-emerald-950 font-extrabold' : 'text-slate-800'} text-[11px] font-bold">${assignedTeacher}</span>` : '<span class="text-slate-300 text-[10px]">-</span>'}
                            </div>
                        </td>
                    `;
                });
                bodyHTML += `</tr>`;
            });
            tbody.innerHTML = bodyHTML;
        }

        // RENDER POHON GURU (DEFAULT WARNA PUTIH / WARNA HIJAU HANYA APABILA DIKLIK)
        function renderGMPTree() {
            const container = document.getElementById('gmp-teacher-tree');
            if(!container) return;
            container.innerHTML = '';
            
            let guruList = databaseRecords.guru || [];
            let senaraiGuru = databaseRecords.senarai_guru || [];

            senaraiGuru.forEach(sg => {
                let teacherRecord = guruList.find(g => g.name.trim().toLowerCase() === sg.name.trim().toLowerCase());
                let totalMasa = 0;
                let subDetailsHTML = '';
                let isExpanded = expandedTeachersMap[sg.name] !== undefined ? expandedTeachersMap[sg.name] : true;

                if(teacherRecord && teacherRecord.category) {
                    let segments = teacherRecord.category.split(' | ');
                    segments.forEach(seg => {
                        let match = seg.match(/^(.*?) \[(.*?)\]$/);
                        if(match) {
                            let cName = match[1].trim();
                            let sDetails = match[2].split(', ').map(s => s.trim());
                            sDetails.forEach(sd => {
                                let subMatch = sd.match(/^(.*?)\s*\((\d+)\s*Masa\)$/) || sd.match(/^(.*?)\s*\((\d+)\)$/);
                                let sNameOrCode = subMatch ? subMatch[1].trim() : sd;
                                let masa = subMatch ? parseInt(subMatch[2]) : 2;
                                totalMasa += masa;

                                let foundSub = (databaseRecords.subjek || []).find(s => s.name.toLowerCase() === sNameOrCode.toLowerCase() || s.code.toLowerCase() === sNameOrCode.toLowerCase());
                                let sCode = foundSub ? foundSub.code : sNameOrCode;

                                let isSubSelected = selectedActiveSubItem && 
                                                    selectedActiveSubItem.teacher.toLowerCase() === sg.name.toLowerCase() &&
                                                    selectedActiveSubItem.kelas.toLowerCase() === cName.toLowerCase() &&
                                                    selectedActiveSubItem.subjekCode.toLowerCase() === sCode.toLowerCase();

                                // HIJAU MUDA HANYA APABILA SUB-ITEM PADA POHON GURU DIKLIK
                                let itemClass = isSubSelected 
                                    ? 'bg-emerald-200 text-emerald-950 font-bold px-1.5 py-0.5 rounded border border-dashed border-emerald-600 shadow-sm' 
                                    : 'text-slate-700 hover:bg-slate-200/60 px-1 py-0.5 rounded';

                                subDetailsHTML += `
                                    <div class="tree-line my-0.5">
                                        <span onclick="selectSubTreeItem('${sg.name}', '${cName}', '${sCode}')" class="cursor-pointer inline-block ${itemClass}">
                                            .. ${sNameOrCode}-${cName}[${masa}]
                                        </span>
                                    </div>
                                `;
                            });
                        }
                    });
                }

                container.innerHTML += `
                    <div class="tree-node mb-1">
                        <div class="font-bold text-[#0b1b3d] flex items-center space-x-1 cursor-pointer select-none">
                            <span onclick="toggleTeacherExpand('${sg.name}')" class="px-1 bg-slate-200 hover:bg-slate-300 rounded text-slate-700 text-xs font-mono">
                                [${isExpanded ? '-' : '+'}]
                            </span>
                            <span onclick="toggleTeacherExpand('${sg.name}')" class="hover:text-emerald-700">
                                ${sg.name.toUpperCase()}[${totalMasa}]
                            </span>
                        </div>
                        <div class="${isExpanded ? 'block' : 'hidden'} tree-children pl-2">
                            ${subDetailsHTML || '<div class="text-[10px] text-slate-400 pl-4 border-l my-0.5">.. Tiada Subjek</div>'}
                        </div>
                    </div>
                `;
            });
        }

        window.toggleTeacherExpand = function(teacherName) {
            expandedTeachersMap[teacherName] = !expandedTeachersMap[teacherName];
            renderGMPTree();
        }

        // APABILA USER KLIK PADA ITEM POHON (CONTOH: Matematik-Tingkatan 1 - IS[2])
        window.selectSubTreeItem = function(teacherName, kelas, subjekCode) {
            // JIKA DIKLIK ITEM YANG SAMA: TOGGLE MATIKAN WARNA (BILA KLIK SEKALI LAGIIA KEMBALI PUTIH)
            if (selectedActiveSubItem && 
                selectedActiveSubItem.teacher.toLowerCase() === teacherName.toLowerCase() &&
                selectedActiveSubItem.kelas.toLowerCase() === kelas.toLowerCase() &&
                selectedActiveSubItem.subjekCode.toLowerCase() === subjekCode.toLowerCase()) {
                selectedActiveSubItem = null;
            } else {
                selectedActiveSubItem = { teacher: teacherName, kelas: kelas, subjekCode: subjekCode };
            }

            renderGMPTree();
            renderGMPMatrix();
        }

        window.onMatrixCellClick = function(e, kelas, subjekCode, teacherName) {
            e.preventDefault();
            if(teacherName) {
                let guruRecord = databaseRecords.senarai_guru.find(g => g.code.toLowerCase() === teacherName.toLowerCase() || g.name.toLowerCase().includes(teacherName.toLowerCase()));
                let fullTeacherName = guruRecord ? guruRecord.name : teacherName;
                
                if (selectedActiveSubItem && 
                    selectedActiveSubItem.kelas.toLowerCase() === kelas.toLowerCase() && 
                    selectedActiveSubItem.subjekCode.toLowerCase() === subjekCode.toLowerCase()) {
                    selectedActiveSubItem = null;
                } else {
                    selectedActiveSubItem = { teacher: fullTeacherName, kelas: kelas, subjekCode: subjekCode };
                }
            } else {
                selectedActiveSubItem = { teacher: '', kelas: kelas, subjekCode: subjekCode };
            }

            renderGMPTree();
            renderGMPMatrix();
        }

        window.onload = () => {
            renderGMPTree();
            renderGMPMatrix();
        };
    </script>
</body>
</html>
